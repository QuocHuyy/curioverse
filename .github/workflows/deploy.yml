name: Deploy Curioverse

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Build lại mỗi tuần: ngày "Cập nhật lần cuối", năm bản quyền, số năm trên GitHub… được tính lúc build
  schedule:
    - cron: '17 3 * * 1' # 10:17 sáng thứ Hai giờ Việt Nam

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tên miền riêng: đặt biến ở Settings → Secrets and variables → Actions → Variables
  SITE_URL: ${{ vars.SITE_URL }}
  BASE_PATH: ${{ vars.BASE_PATH }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Cài thư viện
        run: pnpm install --frozen-lockfile

      - name: Kiểm tra kiểu & frontmatter
        run: pnpm check

      - name: Build + chỉ mục tìm kiếm
        run: pnpm build

      - name: Dò link nội bộ hỏng
        run: pnpm check:links

      - name: Đóng gói cho GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
